name: build & prebuild

on:
  push:
    branches: [master, next]   # master=stable; next=rc prerelease
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # The tested, prebuilt-and-shipped platforms; the release job gates on
        # these. windows-2022 (not -latest=Server2025) so node-gyp finds VS 2022.
        # ubuntu-24.04 (not -latest, which moved to Ubuntu 26 in Oct 2026): the
        # Linux prebuild inherits the build host's glibc/libstdc++ symbol versions,
        # so building on a newer image would stop it loading on 24.04 hosts.
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
      - run: npm ci
      - run: npm run build # regenerate + force current native source; never test a checked-in stale prebuild
      - run: git diff --exit-code -- src/generated/ # tagged generated sources must reproduce exactly
      - run: npm run coverage   # runs the suite under c8 and FAILS if coverage drops below .c8rc.json thresholds
      - name: C++ unit tests (standalone risk/arm) + coverage report
        if: matrix.os == 'ubuntu-24.04'   # Linux leg: g++/gcov; the C++ logic is platform-agnostic
        run: CXX=g++ COVERAGE=1 npm run test:cpp   # gates the C++ tests passing; coverage is reported (best-effort)
      - run: npm run prebuild:napi
      # No --strip: gyp hard-links ctpsdk/linux/*.so into build/Release, so stripping
      # there would rewrite the vendored SDK in place. The build must never touch it.
      - run: git diff --exit-code --stat -- ctpsdk/
      - name: bundle CTP libs alongside the prebuilt addon
        shell: bash
        run: |
          dir=$(ls -d prebuilds/*/ | head -n1)
          case "${{ matrix.os }}" in
            windows-2022)  cp ctpsdk/windows/*.dll "$dir" ;;
            ubuntu-24.04)  cp ctpsdk/linux/*.so "$dir" ;;
          esac
          ls -la "$dir"
      - name: verify the Linux prebuild is relocatable (bare NEEDED names, RUNPATH=$ORIGIN only)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          addon=$(ls prebuilds/linux-x64/*.node)
          dyn=$(readelf -d "$addon")
          grep -E 'NEEDED|RPATH|RUNPATH' <<<"$dyn"
          if grep -E '\(NEEDED\).*\[[^]]*/' <<<"$dyn"; then
            echo "::error::DT_NEEDED contains a path; the prebuild would only load on the build host"; exit 1
          fi
          runpath=$(sed -n 's/.*(\(RPATH\|RUNPATH\)).*\[\(.*\)\]/\2/p' <<<"$dyn")
          if [ "$runpath" != '$ORIGIN' ]; then
            echo "::error::expected RUNPATH \$ORIGIN only, got: $runpath"; exit 1
          fi
          # The bundled CTP libs must be the unmodified vendor files from the repo.
          for so in ctpsdk/linux/*.so; do
            if ! git cat-file blob "HEAD:$so" | cmp - "prebuilds/linux-x64/$(basename "$so")"; then
              echo "::error::prebuilds/linux-x64/$(basename "$so") differs from the committed $so"; exit 1
            fi
          done
          # Load from a different directory so only $ORIGIN can resolve the CTP .so files.
          tmp=$(mktemp -d)
          cp -r prebuilds/linux-x64 "$tmp/"
          moved="$tmp/linux-x64/$(basename "$addon")"
          deps=$(ldd "$moved")
          echo "$deps"
          if grep 'not found' <<<"$deps"; then
            echo "::error::relocated prebuild has unresolved dependencies"; exit 1
          fi
          node -e 'require(process.argv[1])' "$moved"
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/

  # Newest Ubuntu, test-only (ships nothing) and release-gating: the vendor CTP
  # libraries and the shipped ubuntu-24.04 prebuild must also work on Ubuntu
  # 26.04. Added after the vendor Release() on a never-Init()ed API was found to
  # segfault there (glibc 2.43) while every ubuntu-24.04 test stayed green.
  test-ubuntu-26:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
      - run: npm ci
      - run: npm run build # compile on 26.04 and run the full suite against it
      - run: git diff --exit-code -- src/generated/
      - run: npm run coverage
      - uses: actions/download-artifact@v8
        with:
          name: prebuilds-ubuntu-24.04
          path: prebuilds/
      - name: the shipped ubuntu-24.04 prebuild on Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build   # make node-gyp-build load prebuilds/linux-x64, as an installed package does
          node -e 'console.log("addon:", require("node-gyp-build").path("."))'
          node scripts/smoke-cjs.cjs
          node scripts/test-lifecycle.mjs

  # macOS is best-effort and DECOUPLED from the release gate: it builds a prebuild
  # when a macOS runner is free, but the release never waits on it. The CTP vendor
  # framework can't be validated from the dev host, and macOS runners queue
  # unpredictably — so it must never block (or delay) shipping Windows/Linux.
  # Runner: macos-latest (Apple Silicon -> prebuilds/darwin-arm64; the vendored
  # .framework binaries are universal x86_64+arm64). Deliberately -latest, unlike
  # the pinned Windows/Linux images: pinned macOS labels keep being retired
  # (macos-13, then macos-14 on 2026-11-02), and a job on a retired label sits
  # queued for 24h before GitHub cancels it, holding the whole run open. The
  # binary's minimum macOS is fixed by MACOSX_DEPLOYMENT_TARGET in binding.gyp,
  # not by the build host, so following -latest costs no compatibility.
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- src/generated/
      - run: npm test
      - run: npm run prebuild:napi
      - name: bundle CTP libs alongside the prebuilt addon
        shell: bash
        run: |
          dir=$(ls -d prebuilds/*/ | head -n1)
          cp -R ctpsdk/macos/*.framework "$dir"
          ls -la "$dir"
          file "$dir"*.node
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds-macos
          path: prebuilds/

  # Fully automatic release: on pushes to master/next, semantic-release reads the
  # Conventional Commits since the last release, decides the next version (feat ->
  # minor, fix -> patch, BREAKING CHANGE -> major), updates CHANGELOG.md + the
  # package version, cuts a GitHub Release (auto notes + the available prebuilds
  # attached), and publishes @hitrading/ctp-node to npm. If no release-worthy
  # commits exist, it does nothing. Requires the NPM_TOKEN secret.
  release:
    needs: [build, test-ubuntu-26]   # Windows + Linux (+ 26.04 tests); macOS (build-macos) never gates the release
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next') && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}   # 'true' when a version was released
      tag: ${{ steps.semrel.outputs.new_release_git_tag }}           # e.g. v1.1.0
    permissions:
      contents: write        # commit the changelog/version bump + create the Release + tag
      issues: write          # semantic-release comments on released issues/PRs
      pull-requests: write
      id-token: write         # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}   # surfaced so the step below can skip when it's unset
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # semantic-release needs full history + tags
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          # NOTE: deliberately NO registry-url here. setup-node's registry-url
          # writes an .npmrc with _authToken=${NODE_AUTH_TOKEN}, which collides
          # with @semantic-release/npm's own NPM_TOKEN auth and yields a 401
          # ("EINVALIDNPMTOKEN"). semantic-release configures the registry itself.
      - uses: actions/download-artifact@v8
        with:
          name: prebuilds-windows-2022
          path: prebuilds/
      - uses: actions/download-artifact@v8
        with:
          name: prebuilds-ubuntu-24.04
          path: prebuilds/
      - run: npm ci --ignore-scripts
      - run: npm run gen       # fresh checkout: package the same generated API the build jobs tested
      - run: git diff --exit-code -- src/generated/
      - run: npm run build:ts
      - name: bundle the available prebuilds as a release asset
        run: tar -czf ctp-node-prebuilds.tgz prebuilds/
      - name: semantic-release (version + changelog + GitHub Release + npm publish)
        id: semrel
        if: ${{ env.NPM_TOKEN != '' }}   # no-op until you add the NPM_TOKEN secret (keeps the badge green)
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Attach the macOS prebuild to the release ONCE build-macos finishes. macOS
  # runners queue unpredictably, so this runs after BOTH the release and the macOS
  # build — it never delays the npm publish or the release itself. It only acts
  # when a release was actually published, and no-ops gracefully if the macOS build
  # failed/timed out (no artifact). The npm tarball ships Windows/Linux prebuilds;
  # macOS installed from npm builds from source — this enriches the GitHub Release
  # asset for anyone grabbing the prebuild bundle directly.
  attach-macos:
    needs: [build-macos, release]
    if: ${{ always() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the asset to the release
      actions: read     # download the build-macos artifact
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true   # build-macos may have failed/timed out -> no artifact
        with:
          name: prebuilds-macos
          path: prebuilds/
      - name: package + attach the macOS prebuild to ${{ needs.release.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d prebuilds ] && [ -n "$(ls -A prebuilds 2>/dev/null)" ]; then
            tar -czf ctp-node-macos-prebuild.tgz prebuilds/
            gh release upload "${{ needs.release.outputs.tag }}" ctp-node-macos-prebuild.tgz --clobber --repo "$GITHUB_REPOSITORY"
            echo "attached ctp-node-macos-prebuild.tgz to ${{ needs.release.outputs.tag }}"
          else
            echo "no macOS prebuild artifact (build-macos failed or timed out); nothing to attach"
          fi
